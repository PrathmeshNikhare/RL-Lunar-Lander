# Tests and static checks on the target platform (Windows, Python 3.12).
# Installs the exact versions in requirements-lock.txt. Never trains a model:
# the pytest suite only runs short PPO smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Environment check
        run: python scripts/check_environment.py
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy --strict lunar_lander_rl scripts tests
      - name: Pytest
        run: python -m pytest -q
