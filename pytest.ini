[pytest]
testpaths = tests
# The project package is not installed (decision D-015); import it from the repo root.
pythonpath = .
addopts = -ra --strict-markers
# The Box2D 2.3.10 SWIG binding emits these DeprecationWarnings on import.
# They are upstream and not actionable. Turning them into errors crashes the
# interpreter (access violation) rather than failing a test, so they are
# ignored narrowly here; do not replace this with a blanket ignore.
filterwarnings =
    ignore:builtin type swig:DeprecationWarning
    ignore:builtin type SwigPy:DeprecationWarning
